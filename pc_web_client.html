<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Messenger - Universal Web Client (v3.14.8)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background-color: #0c1317;
      color: #e9edef;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 640px;
      background: #111b21;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      padding: 20px;
      border: 1px solid #222e35;
    }
    h1 { font-size: 22px; color: #25d366; text-align: center; margin-top: 0; }
    h2 { font-size: 15px; color: #8696a0; text-align: center; margin-bottom: 16px; }
    .hidden { display: none !important; }
    label { font-weight: bold; display: block; margin-top: 12px; font-size: 14px; color: #aebac1; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      margin-top: 6px;
      font-size: 15px;
      border: 1px solid #2a3942;
      border-radius: 8px;
      background-color: #202c33;
      color: #fff;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #25d366;
      outline: 2px solid #25d366;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:focus { outline: 3px solid #ffd54f; }
    .btn-green { background-color: #00a884; }
    .btn-teal { background-color: #008069; }
    .btn-red { background-color: #ea0038; }
    .btn-gray { background-color: #374248; }
    .btn-gold { background-color: #ffb300; color: #000; }
    
    .nav-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      border-bottom: 1px solid #222e35;
      padding-bottom: 10px;
    }
    .nav-btn {
      flex: 1;
      padding: 10px;
      margin-top: 0;
      font-size: 13px;
      background: #202c33;
      color: #8696a0;
      border-radius: 6px;
    }
    .nav-btn.active {
      background: #00a884;
      color: #fff;
    }

    .msg-box {
      height: 380px;
      border: 1px solid #222e35;
      overflow-y: auto;
      padding: 12px;
      margin: 12px 0;
      background: #0b141a;
      border-radius: 8px;
    }
    .msg-card {
      background: #202c33;
      padding: 10px 14px;
      margin-bottom: 8px;
      border-radius: 8px;
      border-left: 4px solid #00a884;
    }
    .msg-card.me {
      border-left: 4px solid #25d366;
      background: #005c4b;
    }
    .msg-sender {
      font-weight: bold;
      font-size: 13px;
      color: #25d366;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .msg-sender.me { color: #aebac1; }
    .msg-text { font-size: 15px; color: #e9edef; word-wrap: break-word; }
    .user-list-item {
      padding: 12px 14px;
      border-bottom: 1px solid #222e35;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      background: #202c33;
      margin-bottom: 4px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-list-item:focus {
      outline: 3px solid #25d366;
      background: #111b21;
    }
    
    /* Call Modal Banner */
    .call-banner {
      background: #182229;
      border: 2px solid #25d366;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
      text-align: center;
    }
    .call-title { font-size: 16px; font-weight: bold; color: #25d366; margin-bottom: 4px; }
    .call-status-sub { font-size: 13px; color: #8696a0; margin-bottom: 4px; }
    .call-timer { font-size: 16px; color: #ffd54f; font-weight: bold; }
    .call-actions { display: flex; gap: 8px; margin-top: 10px; }

    .sr-only { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>

<div class="container" role="main">

  <!-- Screen Reader Live Announcer Region -->
  <div id="sr-announcer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

  <!-- 1. LOGIN SCREEN -->
  <div id="screen-login">
    <h1>Accessible Messenger</h1>
    <h2>Universal Web Client (v3.11.3)</h2>

    <label for="username">Enter Your Alias / Username</label>
    <input type="text" id="username" placeholder="e.g. John" aria-label="Username edit box">

    <label for="password">Enter Account Password (Optional)</label>
    <input type="password" id="password" placeholder="Password" aria-label="Password edit box">

    <button id="btn-login" class="btn-green" onclick="onLogin()">Connect to Accessible Messenger</button>
  </div>

  <!-- 2. MAIN APP VIEW -->
  <div id="screen-main" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h1 style="font-size:18px; margin:0; text-align:left;">Accessible Messenger</h1>
      <button style="width:auto; margin:0; padding:6px 12px; font-size:12px;" class="btn-red" onclick="onLogout()">Logout</button>
    </div>

    <!-- Active Call Banner (if in call) -->
    <div id="active-call-box" class="call-banner hidden">
      <div id="call-box-title" class="call-title">📞 Voice Call Connected</div>
      <div id="call-box-sub" class="call-status-sub">⚡ Real-Time Audio Streaming Active</div>
      <div id="call-box-timer" class="call-timer">00:00</div>
      <div class="call-actions">
        <button id="btn-call-mute" class="btn-gray" onclick="toggleCallMute()">🎤 Mic On</button>
        <button class="btn-red" onclick="endCurrentCall()">🔴 End Call</button>
      </div>
    </div>

    <!-- Navigation Bar -->
    <div class="nav-bar" role="tablist">
      <button id="tab-public" class="nav-btn active" role="tab" aria-selected="true" onclick="switchTab('public')">🌐 Public Feed</button>
      <button id="tab-users" class="nav-btn" role="tab" aria-selected="false" onclick="switchTab('users')">👥 Online Users</button>
      <button id="tab-chat" class="nav-btn" role="tab" aria-selected="false" onclick="switchTab('chat')">💬 Private Chat</button>
    </div>

    <!-- TAB 1: PUBLIC FEED -->
    <div id="view-public">
      <div style="display:flex; gap:8px; margin-bottom:8px;">
        <button class="btn-gold" style="margin:0; font-size:13px;" onclick="startStageCall()">🎙️ Join Public Voice Stage</button>
        <button class="btn-gray" style="margin:0; font-size:13px; width:auto;" onclick="fetchPublicFeed()">🔄 Refresh</button>
      </div>
      <div id="public-msg-box" class="msg-box" role="log" aria-label="Public feed message list" tabindex="0"></div>
      <div style="display:flex; gap:6px;">
        <input type="text" id="public-input" placeholder="Type public message..." aria-label="Public message input" onkeypress="if(event.key==='Enter') postPublicMessage()">
        <button id="btn-voice-pub" class="btn-gray" style="width:auto; margin:0; padding:0 12px;" onclick="toggleRecord('public')">🎙️</button>
        <button class="btn-green" style="width:auto; margin:0; padding:0 16px;" onclick="postPublicMessage()">Send</button>
      </div>
    </div>

    <!-- TAB 2: ONLINE USERS DIRECTORY -->
    <div id="view-users" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h2 style="margin:0; font-size:15px; color:#25d366;">Active Online Directory</h2>
        <button class="btn-gray" style="width:auto; margin:0; padding:6px 12px; font-size:12px;" onclick="fetchOnlineUsers()">🔄 Refresh</button>
      </div>
      <div id="users-list-box" style="height:380px; overflow-y:auto;" role="list" aria-label="Online users directory" tabindex="0"></div>
    </div>

    <!-- TAB 3: PRIVATE CHAT -->
    <div id="view-chat" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h2 id="txt-chat-target" style="margin:0; font-size:15px; color:#25d366;">Private Chat</h2>
        <button id="btn-call-user" class="btn-green" style="width:auto; margin:0; padding:6px 14px; font-size:13px;" onclick="callCurrentTarget()">📞 Voice Call</button>
      </div>
      <div id="private-msg-box" class="msg-box" role="log" aria-label="Private message thread" tabindex="0"></div>
      <div style="display:flex; gap:6px;">
        <input type="text" id="private-input" placeholder="Type private message..." aria-label="Private message input" onkeypress="if(event.key==='Enter') postPrivateMessage()">
        <button id="btn-voice-priv" class="btn-gray" style="width:auto; margin:0; padding:0 12px;" onclick="toggleRecord('private')">🎙️</button>
        <button class="btn-green" style="width:auto; margin:0; padding:0 16px;" onclick="postPrivateMessage()">Send</button>
      </div>
    </div>

  </div>

</div>

<!-- Incoming Call Modal -->
<div id="modal-incoming-call" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:9999;">
  <div style="background:#111b21; border:2px solid #25d366; border-radius:12px; padding:24px; max-width:400px; width:90%; text-align:center;">
    <h2 id="incoming-caller-txt" style="font-size:20px; color:#25d366; margin-top:0;">📞 Incoming Voice Call</h2>
    <p style="color:#e9edef; font-size:16px;">User is calling you on Accessible Messenger Voice.</p>
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn-green" onclick="acceptIncomingCall()">✅ Accept</button>
      <button class="btn-red" onclick="declineIncomingCall()">❌ Decline</button>
    </div>
  </div>
</div>

<script>
  const BACKEND_URL = "https://messages.vistudio247.workers.dev";
  let currentUser = { name: "", online: false };
  let currentTab = "public";
  let currentChatTarget = "";

  let publicMessages = [];
  let privateMessages = [];
  let lastPublicTs = 0;
  let lastPrivateTs = 0;

  let pollInterval = null;
  let signalInterval = null;
  let isRecording = false;
  let mediaRecorder = null;
  let audioChunks = [];

  // Call Engine State
  let isCallActive = false;
  let activeCallRoomId = "";
  let activeCallType = ""; // "public", "private"
  let activeCallTimer = 0;
  let callTimerInterval = null;
  let isCallMuted = false;
  let pendingIncomingCall = null;
  let callMediaStream = null;
  let callRecorder = null;
  let callAudioLoopInterval = null;
  let callStatusLoopInterval = null;
  let lastPlayedAudioSeq = 0;
  let isCallChunkSending = false;

  function announce(msg) {
    const el = document.getElementById("sr-announcer");
    if (el) el.innerText = msg;
  }

  function isSenderMe(sender) {
    if (!sender || !currentUser.name) return false;
    const s1 = sender.toLowerCase().replace(/[^a-z0-9]/g, "");
    const s2 = currentUser.name.toLowerCase().replace(/[^a-z0-9]/g, "");
    return (s1 !== "" && s1 === s2);
  }

  // --- AUTH & LOGIN ---
  async function onLogin() {
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();
    if (!u) {
      announce("Please enter your username.");
      document.getElementById("username").focus();
      return;
    }

    announce("Connecting to server...");
    try {
      const res = await fetch(`${BACKEND_URL}/api/heartbeat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if (data && data.success) {
        currentUser.name = u;
        currentUser.online = true;
        document.getElementById("screen-login").classList.add("hidden");
        document.getElementById("screen-main").classList.remove("hidden");
        announce(`Connected successfully as ${u}!`);
        startBackgroundLoops();
        fetchPublicFeed();
      } else {
        announce(data.message || "Login failed.");
      }
    } catch(e) {
      announce("Connection error. Please try again.");
    }
  }

  function onLogout() {
    currentUser.online = false;
    if (pollInterval) clearInterval(pollInterval);
    if (signalInterval) clearInterval(signalInterval);
    if (isCallActive) endCurrentCall();
    document.getElementById("screen-main").classList.add("hidden");
    document.getElementById("screen-login").classList.remove("hidden");
    announce("Logged out.");
  }

  // --- NAVIGATION ---
  function switchTab(tab) {
    currentTab = tab;
    document.getElementById("view-public").classList.add("hidden");
    document.getElementById("view-users").classList.add("hidden");
    document.getElementById("view-chat").classList.add("hidden");

    document.getElementById("tab-public").classList.remove("active");
    document.getElementById("tab-users").classList.remove("active");
    document.getElementById("tab-chat").classList.remove("active");

    if (tab === "public") {
      document.getElementById("view-public").classList.remove("hidden");
      document.getElementById("tab-public").classList.add("active");
      fetchPublicFeed();
    } else if (tab === "users") {
      document.getElementById("view-users").classList.remove("hidden");
      document.getElementById("tab-users").classList.add("active");
      fetchOnlineUsers();
    } else if (tab === "chat") {
      document.getElementById("view-chat").classList.remove("hidden");
      document.getElementById("tab-chat").classList.add("active");
      if (currentChatTarget) fetchPrivateChat();
    }
  }

  // --- DELTA SYNCING MESSAGES ---
  async function fetchPublicFeed() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/public-feed?since_ts=${lastPublicTs}&limit=30`);
      if (res.status === 200) {
        const data = await res.json();
        if (data && data.messages && data.messages.length > 0) {
          data.messages.forEach(m => {
            if (!publicMessages.some(x => x.id === m.id || (x.sender === m.sender && x.timestamp === m.timestamp))) {
              publicMessages.push(m);
            }
          });
          publicMessages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
          lastPublicTs = publicMessages[publicMessages.length - 1].timestamp || 0;
          renderPublicMessages();
        }
      }
    } catch(e) {}
  }

  function renderPublicMessages() {
    const box = document.getElementById("public-msg-box");
    box.innerHTML = "";
    publicMessages.forEach(m => {
      const isMe = (m.sender || "").toLowerCase() === currentUser.name.toLowerCase();
      const div = document.createElement("div");
      div.className = `msg-card ${isMe ? 'me' : ''}`;
      
      let bodyHtml = `<div class="msg-sender ${isMe ? 'me' : ''}"><span>${escapeHtml(m.sender || 'User')}</span><span>${m.time || ''}</span></div>`;
      if (m.isVoice || m.audio_id) {
        bodyHtml += `<div class="msg-text">🎙️ Voice Note (${m.duration || 0}s) <button class="btn-green" style="width:auto; padding:4px 10px; font-size:12px; margin-left:8px;" onclick="playAudioVault('${m.audio_id}')">▶️ Play</button></div>`;
      } else {
        bodyHtml += `<div class="msg-text">${escapeHtml(m.text || '')}</div>`;
      }
      div.innerHTML = bodyHtml;
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  }

  async function postPublicMessage() {
    const input = document.getElementById("public-input");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";

    const msgObj = {
      sender: currentUser.name,
      text: text,
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      timestamp: Math.floor(Date.now() / 1000)
    };

    await fetch(`${BACKEND_URL}/api/public-feed`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(msgObj)
    });
    fetchPublicFeed();
    announce("Message sent.");
  }

  // --- ONLINE USERS ---
  async function fetchOnlineUsers() {
    try {
      const FIREBASE_DB = "https://messages-server-f2a99-default-rtdb.asia-southeast1.firebasedatabase.app";
      const now_ts = Math.floor(Date.now() / 1000);
      
      const [allRes, onRes] = await Promise.all([
        fetch(`${FIREBASE_DB}/data/all_users.json?t=${Date.now()}`).catch(() => null),
        fetch(`${FIREBASE_DB}/data/online_users.json?t=${Date.now()}`).catch(() => null)
      ]);

      const allData = (allRes && allRes.ok) ? await allRes.json() : {};
      const onData = (onRes && onRes.ok) ? await onRes.json() : {};

      const onlineMap = {};
      if (onData && typeof onData === "object") {
        Object.values(onData).forEach(v => {
          if (v && v.name) {
            const lastSeen = Number(v.last_seen || 0);
            if ((now_ts - lastSeen <= 60) && (v.status === "Online" || v.online === true)) {
              onlineMap[v.name.toLowerCase().trim()] = true;
            }
          }
        });
      }

      const userMap = {};
      const myClean = (currentUser.name || "").toLowerCase().trim();

      if (allData && typeof allData === "object") {
        Object.values(allData).forEach(v => {
          if (v && v.name) {
            const clean = v.name.trim();
            const lower = clean.toLowerCase();
            if (lower && lower !== myClean) {
              userMap[lower] = {
                displayName: clean,
                isOnline: Boolean(onlineMap[lower])
              };
            }
          }
        });
      }

      const userList = Object.values(userMap);
      userList.sort((a, b) => {
        if (a.isOnline !== b.isOnline) return a.isOnline ? -1 : 1;
        return a.displayName.localeCompare(b.displayName);
      });

      const box = document.getElementById("users-list-box");
      box.innerHTML = "";
      
      if (userList.length === 0) {
        box.innerHTML = `<div style="padding:20px; text-align:center; color:#8696a0;">No other users found.</div>`;
        return;
      }

      userList.forEach(u => {
        const item = document.createElement("div");
        item.className = "user-list-item";
        item.tabIndex = 0;
        const statusHtml = u.isOnline 
          ? `<span style="color:#25d366; font-size:12px;">🟢 Online</span>`
          : `<span style="color:#8696a0; font-size:12px;">⚪ Offline</span>`;
        item.innerHTML = `<span>👤 ${escapeHtml(u.displayName)}</span>${statusHtml}`;
        item.onclick = () => openChatWith(u.displayName);
        item.onkeypress = (e) => { if (e.key === "Enter") openChatWith(u.displayName); };
        box.appendChild(item);
      });
    } catch(e) {
      console.error("fetchOnlineUsers error:", e);
    }
  }

  function openChatWith(target) {
    currentChatTarget = target;
    document.getElementById("txt-chat-target").innerText = `Chat with ${target}`;
    privateMessages = [];
    lastPrivateTs = 0;
    switchTab("chat");
    fetchPrivateChat();
  }

  async function fetchPrivateChat() {
    if (!currentChatTarget) return;
    try {
      const res = await fetch(`${BACKEND_URL}/api/private-messages?user=${currentUser.name}&target=${currentChatTarget}&since_ts=${lastPrivateTs}&limit=30`);
      if (res.status === 200) {
        const data = await res.json();
        if (data && data.messages && data.messages.length > 0) {
          data.messages.forEach(m => {
            if (!privateMessages.some(x => x.id === m.id || (x.sender === m.sender && x.timestamp === m.timestamp))) {
              privateMessages.push(m);
            }
          });
          privateMessages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
          lastPrivateTs = privateMessages[privateMessages.length - 1].timestamp || 0;
          renderPrivateMessages();
        }
      }
    } catch(e) {}
  }

  function renderPrivateMessages() {
    const box = document.getElementById("private-msg-box");
    box.innerHTML = "";
    privateMessages.forEach(m => {
      const isMe = (m.sender || "").toLowerCase() === currentUser.name.toLowerCase();
      const div = document.createElement("div");
      div.className = `msg-card ${isMe ? 'me' : ''}`;
      let bodyHtml = `<div class="msg-sender ${isMe ? 'me' : ''}"><span>${escapeHtml(m.sender || 'User')}</span><span>${m.time || ''}</span></div>`;
      if (m.isVoice || m.audio_id) {
        bodyHtml += `<div class="msg-text">🎙️ Voice Note (${m.duration || 0}s) <button class="btn-green" style="width:auto; padding:4px 10px; font-size:12px; margin-left:8px;" onclick="playAudioVault('${m.audio_id}')">▶️ Play</button></div>`;
      } else {
        bodyHtml += `<div class="msg-text">${escapeHtml(m.text || '')}</div>`;
      }
      div.innerHTML = bodyHtml;
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  }

  async function postPrivateMessage() {
    if (!currentChatTarget) return;
    const input = document.getElementById("private-input");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";

    const msgObj = {
      sender: currentUser.name,
      recipient: currentChatTarget,
      text: text,
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      timestamp: Math.floor(Date.now() / 1000)
    };

    await fetch(`${BACKEND_URL}/api/private-messages`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(msgObj)
    });
    fetchPrivateChat();
    announce("Private message sent.");
  }

  // --- AUDIO VAULT PLAYBACK & RECORDING ---
  async function playAudioVault(audioId) {
    if (!audioId) return;
    announce("Loading voice note...");
    try {
      const res = await fetch(`${BACKEND_URL}/api/audio?id=${audioId}`);
      if (res.ok) {
        const data = await res.json();
        if (data && data.audio) {
          const audio = new Audio(data.audio);
          audio.play();
          announce("Playing voice note.");
        }
      }
    } catch(e) {
      announce("Failed to play audio.");
    }
  }

  function toggleRecord(targetType) {
    if (!isRecording) {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.readAsDataURL(blob);
          reader.onloadend = async () => {
            const b64 = reader.result;
            announce("Uploading voice note...");
            const upRes = await fetch(`${BACKEND_URL}/api/audio/upload`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ audio: b64, duration: 5 })
            });
            const upData = await upRes.json();
            const audioId = (upData && upData.audio_id) ? upData.audio_id : `aud_${Date.now()}`;

            const payload = {
              sender: currentUser.name,
              recipient: currentChatTarget,
              text: "🎙️ Voice Message",
              isVoice: true,
              audio_id: audioId,
              duration: 5,
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              timestamp: Math.floor(Date.now() / 1000)
            };

            if (targetType === "public") {
              await fetch(`${BACKEND_URL}/api/public-feed`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
              fetchPublicFeed();
            } else {
              await fetch(`${BACKEND_URL}/api/private-messages`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
              fetchPrivateChat();
            }
            announce("Voice message sent!");
          };
        };
        mediaRecorder.start();
        isRecording = true;
        announce("Recording started. Click microphone again to send.");
      }).catch(() => announce("Microphone permission denied."));
    } else {
      if (mediaRecorder) mediaRecorder.stop();
      isRecording = false;
    }
  }

  // --- 📞 FULL BI-DIRECTIONAL VOICE CALL & STAGE ENGINE ---
  function startStageCall() {
    startOrJoinVoiceRoom("public_stage", "Public Voice Stage", "public");
  }

  const FIREBASE_DB = "https://messages-server-f2a99-default-rtdb.asia-southeast1.firebasedatabase.app";
  function cleanKey(name) { return (name || "anonymous").toLowerCase().replace(/[^a-z0-9]/g, "_"); }

  function callCurrentTarget() {
    if (!currentChatTarget) return;
    const cleanMe = currentUser.name.toLowerCase().replace(/[^a-z0-9]/g, "_");
    const cleanTarget = currentChatTarget.toLowerCase().replace(/[^a-z0-9]/g, "_");
    const roomId = `private_call_${cleanMe < cleanTarget ? cleanMe + "_" + cleanTarget : cleanTarget + "_" + cleanMe}`;
    
    // Send ringing signal directly to Firebase & Cloudflare
    const sigPayload = { action: "call", from: currentUser.name, to: currentChatTarget, roomId: roomId, mode: "chunk", timestamp: Math.floor(Date.now() / 1000) };
    fetch(`${FIREBASE_DB}/data/call_signals/${cleanKey(currentChatTarget)}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(sigPayload)
    });
    fetch(`${BACKEND_URL}/api/call/signal`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(sigPayload)
    });

    announce(`Calling ${currentChatTarget}... Ringing.`);
    startOrJoinVoiceRoom(roomId, `1-on-1 Call with ${currentChatTarget}`, "private");
  }

  async function startOrJoinVoiceRoom(roomId, title, type) {
    if (!roomId) roomId = "public_stage";
    if (isCallActive) return;
    isCallActive = true;
    activeCallRoomId = roomId;
    activeCallType = type || "public";
    activeCallTimer = 0;
    isCallMuted = false;
    lastPlayedAudioSeq = Date.now();

    document.getElementById("active-call-box").classList.remove("hidden");
    document.getElementById("call-box-title").innerText = `📞 ${title}`;
    document.getElementById("call-box-sub").innerText = (activeCallType === "private") ? "📞 Ringing..." : "🟢 Connected (Talking)";
    announce(`Connecting to ${title}...`);

    try {
      callMediaStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      startAudioTransmissionLoop();
      announce("Microphone active, streaming voice.");
    } catch(e) {
      announce("Microphone access failed. Please allow microphone permissions.");
    }

    if (callTimerInterval) clearInterval(callTimerInterval);
    callTimerInterval = setInterval(() => {
      activeCallTimer++;
      const m = Math.floor(activeCallTimer / 60).toString().padStart(2, '0');
      const s = (activeCallTimer % 60).toString().padStart(2, '0');
      document.getElementById("call-box-timer").innerText = `${m}:${s}`;
    }, 1000);

    // Join room presence in Firebase
    fetch(`${FIREBASE_DB}/data/active_calls/${activeCallRoomId}/participants/${cleanKey(currentUser.name)}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: currentUser.name, joined_at: Math.floor(Date.now() / 1000), last_seen: Math.floor(Date.now() / 1000), isMuted: false })
    });

    startAudioReceiverLoop();
  }

  function startAudioTransmissionLoop() {
    if (!callMediaStream || !isCallActive) return;

    try {
      const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
      callRecorder = new MediaRecorder(callMediaStream, { mimeType: mime });
      callRecorder.ondataavailable = async (e) => {
        if (!isCallActive || isCallMuted || !e.data || e.data.size < 100) return;
        
        const reader = new FileReader();
        reader.readAsDataURL(e.data);
        reader.onloadend = () => {
          const b64 = reader.result;
          if (b64 && isCallActive && !isCallMuted) {
            const chunkPayload = {
              roomId: activeCallRoomId,
              sender: currentUser.name,
              audio: b64,
              seq: Date.now(),
              quality: "HD"
            };
            // Upload directly to Firebase
            fetch(`${FIREBASE_DB}/data/active_calls/${activeCallRoomId}/latest_audio.json`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(chunkPayload)
            }).catch(() => {});
            // Also send to Cloudflare
            fetch(`${BACKEND_URL}/api/call/audio`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(chunkPayload)
            }).catch(() => {});
          }
        };
      };
      callRecorder.start(700);
    } catch(err) {
      console.error("MediaRecorder start failed:", err);
    }
  }

  function startAudioReceiverLoop() {
    if (callStatusLoopInterval) clearInterval(callStatusLoopInterval);

    callStatusLoopInterval = setInterval(async () => {
      if (!isCallActive) return;

      // 1. Fetch live audio chunk & participants directly from Firebase
      try {
        const res = await fetch(`${FIREBASE_DB}/data/active_calls/${activeCallRoomId}.json?t=${Date.now()}`);
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data === "object") {
            const parts = data.participants || {};
            const pCount = Object.keys(parts).length || 1;
            if (activeCallType === "private") {
              if (pCount > 1) {
                document.getElementById("call-box-sub").innerText = `🟢 Connected (${pCount} in call)`;
              }
            } else {
              document.getElementById("call-box-sub").innerText = `🟢 Live Stage (${pCount} in room)`;
            }

            // Play incoming audio if from another user
            if (data.latest_audio && typeof data.latest_audio === "object") {
              const seq = Number(data.latest_audio.seq || 0);
              const sender = data.latest_audio.sender || "";
              if (seq > lastPlayedAudioSeq && !isSenderMe(sender) && data.latest_audio.audio) {
                lastPlayedAudioSeq = seq;
                const incomingAudio = new Audio(data.latest_audio.audio);
                incomingAudio.play().catch(() => {});
              }
            }
          }
        }
      } catch(e) {}

      // 2. If 1-on-1 private call, poll for call signals directly from Firebase
      if (activeCallType === "private") {
        try {
          const myKey = cleanKey(currentUser.name);
          const sigRes = await fetch(`${FIREBASE_DB}/data/call_signals/${myKey}.json?t=${Date.now()}`);
          if (sigRes.ok) {
            const sigData = await sigRes.json();
            if (sigData && typeof sigData === "object") {
              const act = sigData.action;
              if (act === "accept") {
                document.getElementById("call-box-sub").innerText = "🟢 Connected (Talking)";
                announce("Call connected!");
              } else if (act === "decline") {
                announce("Call was declined.");
                endCurrentCall();
              } else if (act === "end") {
                announce("Call ended by user.");
                endCurrentCall();
              }
            }
          }
        } catch(e) {}
      }
    }, 700);
  }

  function toggleCallMute() {
    isCallMuted = !isCallMuted;
    if (callMediaStream) {
      callMediaStream.getAudioTracks().forEach(t => t.enabled = !isCallMuted);
    }
    const btn = document.getElementById("btn-call-mute");
    if (isCallMuted) {
      btn.innerText = "🔇 Mic Muted";
      btn.className = "btn-red";
      announce("Microphone muted.");
    } else {
      btn.innerText = "🎤 Mic On";
      btn.className = "btn-gray";
      announce("Microphone unmuted.");
    }
  }

  function endCurrentCall() {
    if (!isCallActive) return;
    isCallActive = false;
    if (callTimerInterval) clearInterval(callTimerInterval);
    if (callStatusLoopInterval) clearInterval(callStatusLoopInterval);

    document.getElementById("active-call-box").classList.add("hidden");

    if (callRecorder && callRecorder.state !== "inactive") {
      try { callRecorder.stop(); } catch(e) {}
    }
    if (callMediaStream) {
      callMediaStream.getTracks().forEach(t => t.stop());
      callMediaStream = null;
    }

    fetch(`${BACKEND_URL}/api/call/leave`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ roomId: activeCallRoomId, username: currentUser.name })
    });

    if (activeCallType === "private" && currentChatTarget) {
      fetch(`${BACKEND_URL}/api/call/signal`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "end", from: currentUser.name, to: currentChatTarget, roomId: activeCallRoomId })
      });
    }

    announce("Call ended.");
  }

  // --- BACKGROUND CALL SIGNALING (IDLE) ---
  async function checkCallSignals() {
    if (isCallActive || !currentUser.online) return;
    try {
      const res = await fetch(`${BACKEND_URL}/api/call/signal?user=${currentUser.name}&t=${Date.now()}`);
      if (res.ok) {
        const data = await res.json();
        if (data && data.signal && data.signal.action === "call" && !isSenderMe(data.signal.from)) {
          pendingIncomingCall = data.signal;
          document.getElementById("incoming-caller-txt").innerText = `📞 Incoming Call from ${data.signal.from}`;
          document.getElementById("modal-incoming-call").classList.remove("hidden");
          announce(`Incoming voice call from ${data.signal.from}.`);
        }
      }
    } catch(e) {}
  }

  function acceptIncomingCall() {
    document.getElementById("modal-incoming-call").classList.add("hidden");
    if (!pendingIncomingCall) return;
    const call = pendingIncomingCall;
    pendingIncomingCall = null;

    fetch(`${BACKEND_URL}/api/call/signal`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "accept", from: currentUser.name, to: call.from, roomId: call.roomId })
    });

    startOrJoinVoiceRoom(call.roomId, `1-on-1 Call with ${call.from}`, "private");
  }

  function declineIncomingCall() {
    document.getElementById("modal-incoming-call").classList.add("hidden");
    if (!pendingIncomingCall) return;
    const call = pendingIncomingCall;
    pendingIncomingCall = null;

    fetch(`${BACKEND_URL}/api/call/signal`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "decline", from: currentUser.name, to: call.from, roomId: call.roomId })
    });
    announce("Call declined.");
  }

  function startBackgroundLoops() {
    pollInterval = setInterval(() => {
      if (!currentUser.online) return;
      if (currentTab === "public") fetchPublicFeed();
      else if (currentTab === "chat" && currentChatTarget) fetchPrivateChat();
    }, 4000);

    signalInterval = setInterval(() => {
      if (!currentUser.online) return;
      checkCallSignals();
    }, 1200);
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.innerText = text || "";
    return div.innerHTML;
  }

  // --- ACCESSIBLE LINE-BY-LINE INFO ENGINE ---
  const infoData = {
    guide: [
      "📖 ACCESSIBLE MESSENGER USER MANUAL",
      "------------------------------------",
      "1. 🎙️ ACCESSIBLE VOICE NOTES:",
      "• Click/tap any voice note to play audio immediately.",
      "• Use 🎙️ button to record and send voice messages directly.",
      "------------------------------------",
      "2. 📞 LIVE VOICE CALLS (WEBRTC & CHUNKS):",
      "• Open any Private Chat and tap '📞 Voice Call'.",
      "• High-speed WebRTC real-time voice streaming with ultra-low latency.",
      "• Integrated OpenRelay TURN servers guarantee seamless connections across networks.",
      "------------------------------------",
      "3. 💬 1-ON-1 PRIVATE CHATS:",
      "• Open Directory tab to view all registered community members.",
      "• Real-time 🟢 Online and ⚪ Offline indicators show user availability.",
      "------------------------------------",
      "4. 🌐 GLOBAL PUBLIC LOBBY:",
      "• Worldwide real-time chat room.",
      "• Broadcast text and voice messages to everyone.",
      "------------------------------------",
      "5. ⚡ DATA-SAVER ENGINE:",
      "• Background delta-syncing ensures minimal data usage."
    ],
    changelog: [
      "📜 VERSION CHANGELOG & RELEASE NOTES",
      "------------------------------------",
      "★ VERSION 3.14.8 (Latest Release):",
      "• WebRTC Voice Audio Fixes: Injected DOM audio element, Base64 bridging, and candidate buffer.",
      "• Added OpenRelay public TURN relay servers for strict network calling.",
      "• Fixed New Chat user directory to permanently list all registered members.",
      "• Added Global Background Sync for incoming private messages with TTS alerts.",
      "• Added 3-tier GitHub Raw and jsDelivr CDN mirror auto-update engine.",
      "• Added Line-by-Line Accessible ListView for Help, Guide, and Changelog dialogs.",
      "------------------------------------",
      "★ VERSION 3.14.6 & 3.14.5:",
      "• Fixed AsyncTask thread pool exhaustion & Screen-Off battery saver.",
      "• Low-bandwidth AMR_NB 12.2kbps compression."
    ],
    about: [
      "ℹ️ ABOUT ACCESSIBLE MESSENGER",
      "------------------------------------",
      "App Name: Accessible Messenger (Chatify for the Blind)",
      "Version: 3.14.8 (Build Code: 84)",
      "Universal Web Client: Fully accessible on all browsers with NVDA, JAWS, VoiceOver & TalkBack.",
      "Purpose: Empower visually impaired users with accessible real-time communication.",
      "Infrastructure: High-Speed Real-Time Cloud Engine",
      "Developer: Ghayas Dev & Open Accessibility Community"
    ]
  };

  function openInfoModal(type) {
    document.getElementById("modal-accessible-info").classList.remove("hidden");
    renderInfoTab(type || 'guide');
  }

  function closeInfoModal() {
    document.getElementById("modal-accessible-info").classList.add("hidden");
  }

  function renderInfoTab(tabKey) {
    const list = infoData[tabKey] || infoData.guide;
    const titles = { guide: "📖 User Guide & Manual", changelog: "📜 Version Changelog", about: "ℹ️ About Accessible Messenger" };
    document.getElementById("info-modal-title").innerText = titles[tabKey] || "Information";
    
    const box = document.getElementById("info-modal-list");
    box.innerHTML = "";
    list.forEach((line, idx) => {
      const item = document.createElement("div");
      item.style.padding = "8px 10px";
      item.style.borderBottom = "1px solid #1f2c34";
      item.style.fontSize = "14px";
      item.style.color = line.startsWith("★") || line.startsWith("📖") || line.startsWith("📜") || line.startsWith("ℹ️") ? "#25d366" : (line.startsWith("---") ? "#555" : "#e9edef");
      item.style.fontWeight = line.startsWith("★") || line.includes(":") ? "bold" : "normal";
      item.tabIndex = 0;
      item.setAttribute("role", "listitem");
      item.innerText = line;
      box.appendChild(item);
    });
    box.scrollTop = 0;
    announce(titles[tabKey] + " loaded. Navigate line by line.");
  }

</script>

</div>
